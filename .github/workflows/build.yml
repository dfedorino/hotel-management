name: build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Actions are pinned to commit SHAs: tags can be moved, SHAs cannot.
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Sonar needs full history for blame and new-code detection.
          fetch-depth: 0

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and run static checks
        run: ./mvnw -B verify

      - name: Cache SonarCloud packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Skipped until the SONAR_TOKEN secret is set and for pull requests from forks.
      - name: SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        run: ./mvnw -B sonar:sonar
