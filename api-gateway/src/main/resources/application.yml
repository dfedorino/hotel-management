spring:
  application:
    name: api-gateway

  # One virtual thread per proxied request: blocking calls to the services do not tie up platform threads.
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    # Must match the services; override with JWT_SECRET outside local development.
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}

# Every request is traced (no exporter: trace and span ids correlate the logs of all services).
management.tracing.sampling.probability: 1.0

# Console stays human-readable; the file gets one ECS JSON event per line (with traceId, spanId and MDC fields)
# for log collectors.
logging:
  file:
    name: ${LOG_FILE:logs/${spring.application.name}.json}
  structured:
    format:
      file: ecs
