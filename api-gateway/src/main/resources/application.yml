spring:
  application:
    name: api-gateway

server:
  port: ${PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    # Must match the services; override with JWT_SECRET outside local development.
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}

# Every request is traced (no exporter: trace and span ids correlate the logs of all services).
management.tracing.sampling.probability: 1.0
