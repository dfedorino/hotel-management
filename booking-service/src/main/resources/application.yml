spring:
  application:
    name: booking-service

server:
  port: ${PORT:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    # Must match Hotel Service; override with JWT_SECRET outside local development.
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}

springdoc:
  api-docs:
    # Required for /v3/api-docs/swagger-config; the code-derived spec itself is denied in SecurityConfig,
    # so the contract file stays the only published spec.
    enabled: ${booking.api-docs.enabled}
  swagger-ui:
    enabled: ${booking.api-docs.enabled}
    url: /openapi/booking-service.yaml
    query-config-enabled: false

booking:
  api-docs:
    # Turn off outside local development: hides the contract, Swagger UI and its config.
    enabled: ${API_DOCS_ENABLED:true}
  token:
    ttl: PT1H
  demo-data:
    enabled: ${DEMO_DATA:true}

spring.cloud.openfeign.client.config.default:
  connect-timeout: 1000
  read-timeout: 2000

# Hotel Service calls: 3 attempts with 200ms, 400ms pauses on network errors and 5xx; 4xx answers are final.
# The circuit opens when half of the last 10 calls failed and lets calls through again after 10s.
resilience4j:
  retry:
    instances:
      hotel-service:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - feign.RetryableException
          - feign.FeignException$FeignServerException
        ignore-exceptions:
          - ru.hotel.hotelapi.error.HotelServiceClientException
  circuitbreaker:
    instances:
      hotel-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        ignore-exceptions:
          - ru.hotel.hotelapi.error.HotelServiceClientException
