databaseChangeLog:
  - changeSet:
      id: 002-bookings
      author: hotel-management
      changes:
        - createTable:
            tableName: bookings
            remarks: Stays of users over [start_date, end_date), coordinated with Hotel Service by a saga
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_bookings
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_bookings_user
                    references: users(id)
              - column:
                  name: room_id
                  type: BIGINT
                  remarks: Room in Hotel Service (no foreign key across services)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  remarks: Check-out day, not occupied
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(16)
                  remarks: PENDING, CONFIRMED or CANCELLED
                  constraints:
                    nullable: false
              - column:
                  name: request_id
                  type: VARCHAR(64)
                  remarks: Client correlation id; a repeated request returns the booking created the first time
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_bookings_request_id
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - createIndex:
            tableName: bookings
            indexName: idx_bookings_user_created
            columns:
              - column:
                  name: user_id
              - column:
                  name: created_at
