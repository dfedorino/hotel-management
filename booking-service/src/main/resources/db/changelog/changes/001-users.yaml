databaseChangeLog:
  - changeSet:
      id: 001-users
      author: hotel-management
      changes:
        - createTable:
            tableName: users
            remarks: Guests (USER) and administrators (ADMIN)
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_users_username
              - column:
                  name: password
                  type: VARCHAR(255)
                  remarks: BCrypt hash
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(16)
                  remarks: USER or ADMIN
                  constraints:
                    nullable: false
