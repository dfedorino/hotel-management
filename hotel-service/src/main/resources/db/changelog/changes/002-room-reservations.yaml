databaseChangeLog:
  - changeSet:
      id: 002-room-reservations
      author: hotel-management
      changes:
        - createTable:
            tableName: room_reservations
            remarks: Slots held for bookings over [start_date, end_date); date occupancy is decided here
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_room_reservations
              - column:
                  name: room_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_reservations_room
                    references: rooms(id)
              - column:
                  name: booking_id
                  type: BIGINT
                  remarks: Booking in Booking Service (no foreign key across services)
                  constraints:
                    nullable: false
              - column:
                  name: request_id
                  type: VARCHAR(64)
                  remarks: Correlation id of the saga request; makes confirm and release idempotent
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_reservations_request_id
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  remarks: Check-out day, not occupied
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(16)
                  remarks: ACTIVE while the slot is held, RELEASED after compensation or cancellation
                  constraints:
                    nullable: false

        - createIndex:
            tableName: room_reservations
            indexName: idx_reservations_room_dates
            columns:
              - column:
                  name: room_id
              - column:
                  name: start_date
              - column:
                  name: end_date
