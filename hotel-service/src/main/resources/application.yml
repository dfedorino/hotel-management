spring:
  application:
    name: hotel-service

server:
  port: ${PORT:8081}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    # Required for /v3/api-docs/swagger-config; the code-derived spec itself is denied in SecurityConfig,
    # so the contract file stays the only published spec.
    enabled: ${hotel.api-docs.enabled}
  swagger-ui:
    enabled: ${hotel.api-docs.enabled}
    url: /openapi/hotel-service.yaml
    query-config-enabled: false

hotel:
  api-docs:
    # Turn off outside local development: hides the contract, Swagger UI and its config.
    enabled: ${API_DOCS_ENABLED:true}
  demo-data:
    enabled: ${DEMO_DATA:true}

security:
  jwt:
    # Must match Booking Service; override with JWT_SECRET outside local development.
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
