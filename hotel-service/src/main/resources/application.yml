spring:
  application:
    name: hotel-service

server:
  port: ${PORT:8081}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    url: /openapi/hotel-service.yaml

hotel:
  demo-data:
    enabled: ${DEMO_DATA:true}

security:
  jwt:
    # Must match Booking Service; override with JWT_SECRET outside local development.
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
